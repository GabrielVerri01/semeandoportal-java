# PostgreSQL local da versão Java. Porta 5434 para não conflitar com o banco da versão Next.js (5432).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: semeando
      POSTGRES_PASSWORD: semeando
      POSTGRES_DB: semeando
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
