spring.application.name=semeando

# Banco: PostgreSQL local (docker compose up -d). Em produção, sobrescreva por variáveis de ambiente
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:postgresql://localhost:5434/semeando
spring.datasource.username=semeando
spring.datasource.password=semeando

# O schema é o mesmo da versão Next.js (Prisma): Flyway cria; o Hibernate só confere.
# Em um banco já criado pelo Prisma, o Flyway assume a versão 2 sem reexecutar as migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Tabelas e colunas em camelCase e entre aspas, exatamente como o Prisma criou ("Aluno"."numeroMatricula").
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Datas e horas gravadas em UTC, em colunas TIMESTAMP(3) sem fuso (como o Prisma faz).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
